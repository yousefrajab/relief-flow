<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReliefFlow — غير متصل</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f7f6;
        color: #142a24;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, Arial, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
    }
    .card { max-width: 360px; }
    .mark {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: #1f9a79;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 13px; color: #5b6b66; line-height: 1.7; margin: 0; }
    button {
        margin-top: 20px;
        background: #1f9a79;
        color: white;
        border: none;
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
    }
</style>
</head>
<body>
    <div class="card">
        <div class="mark">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" /></svg>
        </div>
        <h1>أنت غير متصل بالإنترنت</h1>
        <p>هاي الصفحة ما تم زيارتها من قبل فما فيها نسخة محفوظة. الصفحات يلي زرتها سابقاً بتضل متاحة، وأي طلب مساعدة تعبيه رح يترسل تلقائياً لما يرجع الاتصال.</p>
        <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
</body>
</html>
